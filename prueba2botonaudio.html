<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MoviTransporte - Caja</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #10b981;
            --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --danger-color: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* ================= PANTALLA PRINCIPAL ================= */
        #pantalla-historial { display: flex; flex-direction: column; height: 100%; position: relative; }

        .header-total { background: var(--card-bg); padding: 25px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.2); z-index: 10; }
        .header-total h2 { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px;}
        .total-monto { font-size: 3.2rem; font-weight: 900; color: var(--accent-color); line-height: 1; }
        
        .lista-pagos { flex: 1; overflow-y: auto; padding: 20px 20px 90px 20px; display: flex; flex-direction: column; gap: 12px; }

        .item-pago { background: var(--card-bg); border-radius: 16px; padding: 16px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--accent-color); animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }

        .item-info { display: flex; flex-direction: column; gap: 4px; }
        .item-hora { font-size: 0.75rem; color: var(--text-muted); }
        .item-ref { font-size: 0.85rem; color: #cbd5e1; font-family: monospace; }
        .item-monto { font-size: 1.4rem; font-weight: 800; color: var(--accent-color); text-align: right; }

        .vacio { text-align: center; color: var(--text-muted); margin-top: 50px; font-size: 0.9rem; }

        /* ================= BOTONES INFERIORES ================= */
        .barra-acciones {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            background: #0f172ae6;
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            display: flex; gap: 10px;
            border-top: 1px solid rgba(255,255,255,0.05);
            z-index: 50;
        }

        .btn-accion {
            flex: 1; padding: 15px; border-radius: 12px; border: none;
            font-weight: 800; font-size: 0.95rem; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            transition: transform 0.1s;
        }
        .btn-accion:active { transform: scale(0.95); }
        
        .btn-cierre { background: #3b82f6; color: white; }
        .btn-borrar { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }

        /* ================= ALERTA GIGANTE ================= */
        #alerta-pago { display: none; position: absolute; inset: 0; background: var(--accent-gradient); flex-direction: column; align-items: center; justify-content: space-between; text-align: center; padding: 40px 20px; z-index: 100; }

        .badge-pago { background: rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; }
        .monto-alerta { font-size: 6rem; font-weight: 900; line-height: 1; letter-spacing: -2px; text-shadow: 0 10px 20px rgba(0,0,0,0.15); }
        .monto-alerta span { font-size: 3rem; vertical-align: top; margin-right: 5px; }

        .card-alerta { background: rgba(0,0,0,0.15); backdrop-filter: blur(10px); padding: 20px; border-radius: 20px; width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 10px; border: 1px solid rgba(255,255,255,0.2); }
        .nombre-alerta { font-size: 1.2rem; font-weight: 800; text-transform: uppercase; display: none; }
        .label-ref { font-size: 0.75rem; color: rgba(255,255,255,0.8); text-transform: uppercase; font-weight: 600; letter-spacing: 1px; }
        .valor-ref { font-size: 1.8rem; font-weight: 800; font-family: monospace; letter-spacing: 2px; }
        .valor-ref span { opacity: 0.6; font-size: 1.2rem; margin-right: 5px;}

        .btn-cerrar { background: #fff; color: #047857; border: none; padding: 18px 40px; border-radius: 30px; font-size: 1.1rem; font-weight: 800; width: 100%; max-width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); cursor: pointer; }
        .btn-cerrar:active { transform: scale(0.95); }

        /* ================= MODAL DE CIERRE (REPORTE) ================= */
        #modal-cierre { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.8); z-index: 150; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal-contenido { background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 15px; animation: zoomUp 0.3s ease; }
        
        .modal-titulo { font-size: 1.2rem; font-weight: 800; color: white; display: flex; justify-content: space-between; align-items: center;}
        .btn-cerrar-modal { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
        
        .reporte-texto { width: 100%; height: 200px; background: #0f172a; color: #cbd5e1; border: 1px solid #334155; border-radius: 10px; padding: 10px; font-family: monospace; font-size: 0.8rem; resize: none; }
        
        .btn-copiar { background: var(--accent-color); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; width: 100%; }

        @keyframes zoomUp { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .animate-zoom { animation: zoomUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>

<body>

    <!-- PANTALLA PRINCIPAL -->
    <div id="pantalla-historial">
        <div class="header-total">
            <h2>Total Recaudado</h2>
            <div class="total-monto" id="txt-total">Bs. 0,00</div>
        </div>
        
        <div class="lista-pagos" id="lista-pagos">
            <div class="vacio">No hay transacciones registradas hoy.</div>
        </div>

        <!-- Barra de botones -->
        <div class="barra-acciones">
            <button class="btn-accion btn-borrar" onclick="borrarHistorial()">🗑️ Borrar</button>
            <button class="btn-accion btn-cierre" onclick="generarCierre()">📄 Generar Cierre</button>
        </div>
    </div>

    <!-- ALERTA GIGANTE (PAGO NUEVO) -->
    <div id="alerta-pago">
        <div style="display:flex; flex-direction:column; align-items:center; margin-top: 20px;" class="animate-zoom">
            <div class="badge-pago">Pago Recibido</div>
            <div class="monto-alerta" id="txt-monto"><span>Bs.</span>0,00</div>
        </div>

        <div class="card-alerta animate-zoom" style="animation-delay: 0.1s;">
            <div class="nombre-alerta" id="txt-nombre">Nombre Cliente</div>
            <div>
                <div class="label-ref">Referencia</div>
                <div class="valor-ref" id="txt-referencia"><span>....</span>----</div>
            </div>
        </div>

        <button class="btn-cerrar animate-zoom" style="animation-delay: 0.2s;" onclick="cerrarAlerta()">ENTENDIDO</button>
    </div>

    <!-- MODAL DE CIERRE (REPORTE) -->
    <div id="modal-cierre">
        <div class="modal-contenido">
            <div class="modal-titulo">
                <span>Cierre de Caja</span>
                <button class="btn-cerrar-modal" onclick="cerrarModal()">&times;</button>
            </div>
            <textarea class="reporte-texto" id="texto-reporte" readonly></textarea>
            <button class="btn-copiar" onclick="copiarReporte()">📋 Copiar para WhatsApp</button>
        </div>
    </div>
    
        <script>
        // --- 1. BASE DE DATOS LOCAL ---
        let historial = JSON.parse(localStorage.getItem('movi_historial')) || [];

        function guardarHistorial() {
            localStorage.setItem('movi_historial', JSON.stringify(historial));
            actualizarInterfaz();
        }

        // --- 2. LECTURA DE URL ---
        function obtenerParametro(nombre) {
            const url = new URL(window.location.href);
            return url.searchParams.get(nombre);
        }

        // Función matemática para limpiar el monto (quita puntos de miles y cambia coma por punto)
        function parsearMonto(montoStr) {
            if (!montoStr) return 0;
            let limpio = montoStr.replace(/\./g, '').replace(',', '.');
            return parseFloat(limpio) || 0;
        }

        window.onload = function() {
            actualizarInterfaz();

            const monto = obtenerParametro('monto');
            const ref = obtenerParametro('ref');
            const nombre = obtenerParametro('nombre');
            const timestamp = obtenerParametro('v') || Date.now().toString();

            if (monto) {
                // Verificar duplicados
                const yaExiste = historial.some(p => p.timestamp === timestamp && p.ref === ref);
                
                if (!yaExiste) {
                    const nuevoPago = {
                        timestamp: timestamp,
                        montoNum: parsearMonto(monto), 
                        montoStr: monto, 
                        ref: ref || '----',
                        nombre: nombre || ''
                    };
                    historial.unshift(nuevoPago); 
                    guardarHistorial();
                }
                mostrarAlerta(monto, ref, nombre);
            }
        };

        // --- 3. LÓGICA DE LA ALERTA ---
        function mostrarAlerta(monto, ref, nombre) {
            document.getElementById('txt-monto').innerHTML = `<span>Bs.</span>${monto}`;
            
            const refCorta = ref ? ref.slice(-4) : '----';
            document.getElementById('txt-referencia').innerHTML = `<span>....</span>${refCorta}`;

            const txtNombre = document.getElementById('txt-nombre');
            if (nombre && nombre.trim() !== "") {
                txtNombre.textContent = nombre;
                txtNombre.style.display = 'block';
            } else {
                txtNombre.style.display = 'none';
            }

            document.getElementById('alerta-pago').style.display = 'flex';
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        }

        function cerrarAlerta() {
            document.getElementById('alerta-pago').style.display = 'none';
            window.history.replaceState({}, document.title, window.location.pathname); 
        }

        // --- 4. LÓGICA DEL HISTORIAL ---
        function actualizarInterfaz() {
            const lista = document.getElementById('lista-pagos');
            let total = 0;
            
            if (historial.length === 0) {
                lista.innerHTML = '<div class="vacio">No hay transacciones registradas hoy.</div>';
                document.getElementById('txt-total').innerText = 'Bs. 0,00';
                return;
            }

            lista.innerHTML = '';
            historial.forEach(pago => {
                total += pago.montoNum;
                
                const div = document.createElement('div');
                div.className = 'item-pago';
                div.innerHTML = `
                    <div class="item-info">
                        <div class="item-monto" style="color:var(--accent-color); text-align:left;">Bs. ${pago.montoStr}</div>
                        <div class="item-ref">Ref: ....${pago.ref.slice(-4)}</div>
                        <div class="item-hora">${new Date(parseInt(pago.timestamp)).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                    </div>
                `;
                lista.appendChild(div);
            });

            document.getElementById('txt-total').innerText = 'Bs. ' + total.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        // --- 5. GENERAR REPORTE DE CIERRE ---
        function generarCierre() {
            if (historial.length === 0) {
                alert("No hay pagos registrados para generar el cierre.");
                return;
            }

            const fecha = new Date().toLocaleDateString('es-VE');
            let total = 0;
            let texto = `🚌 *CIERRE DE CAJA - MOVITRANSPORTE* 🚌\n`;
            texto += `📅 Fecha: ${fecha}\n`;
            texto += `🧾 Operaciones: ${historial.length}\n`;
            texto += `-------------------------\n`;

            // Lo recorremos en orden inverso (del más antiguo al más nuevo) para el reporte
            const historialInverso = [...historial].reverse();
            
            historialInverso.forEach((pago, index) => {
                total += pago.montoNum;
                const hora = new Date(parseInt(pago.timestamp)).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                texto += `${index + 1}. Bs. ${pago.montoStr} | Ref: ...${pago.ref.slice(-4)} (${hora})\n`;
            });

            texto += `-------------------------\n`;
            texto += `💰 *TOTAL RECAUDADO: Bs. ${total.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}*\n\n`;
            texto += `_Generado automáticamente por MoviTransporte_`;

            document.getElementById('texto-reporte').value = texto;
            document.getElementById('modal-cierre').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('modal-cierre').style.display = 'none';
        }

        function copiarReporte() {
            const textarea = document.getElementById('texto-reporte');
            textarea.select();
            textarea.setSelectionRange(0, 99999);
            
            // Intentar copiar usando la API moderna
            if (navigator.clipboard) {
                navigator.clipboard.writeText(textarea.value).then(() => {
                    alert("¡Reporte copiado! Pégalo en WhatsApp.");
                }).catch(err => {
                    alert("Error al copiar. Mantén presionado el texto para copiarlo manualmente.");
                });
            } else {
                // Fallback para navegadores viejos
                document.execCommand('copy');
                alert("¡Reporte copiado! Pégalo en WhatsApp.");
            }
        }

        // --- 6. BORRAR HISTORIAL ---
        function borrarHistorial() {
            if (confirm("¿Estás seguro de que deseas borrar todo el historial? Esta acción no se puede deshacer.")) {
                historial = [];
                localStorage.removeItem('movi_historial');
                actualizarInterfaz();
                alert("Historial borrado.");
            }
        }
    </script>
</body>
</html>
